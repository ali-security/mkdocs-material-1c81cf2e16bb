name: build
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: pytest -k expression selecting a subset of the wheel tests (empty runs all)
        required: false
        default: ''

env:
  NODE_VERSION: 24.x
  PYTHON_VERSION: 3.x

permissions:
  contents: read

jobs:
  npm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js dependency cache
        uses: actions/cache@v4
        id: cache
        with:
          key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: node_modules

      - name: Set up Node.js dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Build project
        run: |
          npm run build
          git diff --name-only

  npm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js dependency cache
        uses: actions/cache@v4
        id: cache
        with:
          key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: node_modules

      - name: Set up Node.js dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Check project
        run: npm run check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Set up Python dependencies
        run: pip install --upgrade build twine

      - name: Set up Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js dependency cache
        uses: actions/cache@v4
        id: cache
        with:
          key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: node_modules

      - name: Set up Node.js dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      # Regenerate the prebuilt theme assets in material/ from src/, so that the
      # minified bundles shipped in the distributions carry the patched sources.
      # The browserslist query in .browserslistrc ("last 4 years") moves with
      # the clock, so pin it to the window of the 9.7.6 release to keep the
      # stylesheets reproducible and their browser support unchanged. Files the
      # build only rewrote with different line endings (icon licenses copied
      # from node_modules) are restored to their checked-in form.
      - name: Build theme assets
        env:
          BROWSERSLIST: since 2022-03-19
        run: |
          npm run build
          git ls-files -m -z -- material | while IFS= read -r -d '' file; do
            if git diff --quiet -- "$file"; then
              git checkout -- "$file"
            fi
          done
          git status --porcelain

      - name: Build Python package
        run: |
          echo "hatchling==1.29.0" > "${RUNNER_TEMP}/build-constraints.txt"
          PIP_CONSTRAINT="${RUNNER_TEMP}/build-constraints.txt" python -m build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

      - name: Test built wheel
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install dist/mkdocs_material-*.whl pytest
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/venv/bin/python" -m pytest -v -rA -p no:cacheprovider \
            "${GITHUB_WORKSPACE}/.github/seal/test_wheel.py" ${TEST_FILTER:+-k "$TEST_FILTER"}

      - name: Publish Python package
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.event.repository.full_name }}
            ghcr.io/${{ github.event.repository.full_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=${{ github.event.release.prerelease == false }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check Docker image
        working-directory: /tmp
        env:
          REPO_FULL_NAME: '${{ github.event.repository.full_name }}'
        run: |
          docker run --rm -i -v ${PWD}:/docs ${REPO_FULL_NAME,,}:${{ steps.meta.outputs.version }} new .
          docker run --rm -i -v ${PWD}:/docs ${REPO_FULL_NAME,,}:${{ steps.meta.outputs.version }} build

      - name: Set platforms
        if: github.event_name == 'release'
        run: |
          echo "PLATFORMS=linux/amd64,linux/arm64,linux/arm/v7" >> $GITHUB_ENV

      - name: Publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check manifest
        if: github.event_name == 'release'
        run: |
          docker buildx imagetools inspect ${{ github.event.repository.full_name }}:${{ steps.meta.outputs.version }}

      - name: Inspect image
        if: github.event_name == 'release'
        run: |
          docker pull ${{ github.event.repository.full_name }}:${{ steps.meta.outputs.version }}
          docker image inspect ${{ github.event.repository.full_name }}:${{ steps.meta.outputs.version }}
